services:
  - type: web
    name: csms-trac-bsit
    runtime: node
    plan: free
    repo: https://github.com/kerrfairtex/Class-Schedule-Management-System-for-information-technology-Students
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CSMS_DATA_DIR
        value: /data/csms-data
      - key: DATABASE_URL
        value: postgresql://postgres:4n=AgYHXO?%ESEKv@db.hoaimqynxhvyobcfqvfb.supabase.co:5432/postgres?options=search_path%3Dcsms
    buildCommand: npm ci && npm run build
    startCommand: node .next/standalone/server.js
    autoDeployTrigger: commit
    disk:
      name: csms-data
      mountPath: /data/csms-data
      sizeGB: 1
    previews:
      generation: automatic
